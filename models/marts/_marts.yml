version: 2

models:
  - name: fct_precios_cambios
    description: >
      Historial de precios: una fila por cada cambio en un comercio, producto y provincia.
      Cada fila vale desde fecha_desde hasta el día anterior al cambio siguiente.
    data_tests:
      - unique:
          arguments:
            column_name: "id_comercio || '|' || id_producto || '|' || provincia || '|' || fecha_desde"
    columns:
      - name: fecha_desde
        data_tests:
          - not_null
      - name: precio_lista_mediana
        data_tests:
          - not_null

  - name: fct_precios_historial
    description: >
      Cada versión de precio con su período de validez (fecha_desde, fecha_hasta) y su estado:
      reemplazado, vigente o no disponible (más de 7 días sin aparecer).
    columns:
      - name: estado
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['reemplazado', 'vigente', 'no disponible']
      - name: ultima_fecha_vista
        data_tests:
          - not_null

  - name: dim_productos
    description: >
      Un producto por clave (EAN sin ceros o "comercio-código"), con nombre, marca y texto de
      búsqueda. Se arma con todas las fechas para conservar los productos que ya no se venden.
    columns:
      - name: clave
        data_tests:
          - unique
          - not_null
      - name: nombre
        data_tests:
          - not_null
      - name: cadenas
        data_tests:
          - not_null

  - name: fct_canasta_nacional
    description: >
      Canasta nacional por fecha y cadena: productos observados y arrastrados (último precio de
      hasta 7 días), si está completa y el total, que solo existe cuando está completa.
    data_tests:
      - unique:
          arguments:
            column_name: "fecha || '|' || id_comercio"
    columns:
      - name: completa
        data_tests:
          - not_null

  - name: fct_canasta_provincia_productos
    description: >
      Los productos con que se compara cada provincia cada día: los códigos de barras que tienen
      todas las cadenas de la provincia, con su mediana entre cadenas. Base de fct_canasta_provincia
      y de la lista de productos del sitio.
    data_tests:
      - unique:
          arguments:
            column_name: "fecha || '|' || provincia || '|' || clave"
    columns:
      - name: mediana
        data_tests:
          - not_null

  - name: fct_canasta_provincia
    description: >
      Ranking del día de las cadenas en cada provincia, con un índice de precios (media geométrica
      del precio relativo a la mediana) sobre todos los códigos de barras que tienen todas las
      cadenas de esa provincia ese día.
    data_tests:
      - unique:
          arguments:
            column_name: "fecha || '|' || provincia || '|' || id_comercio"
    columns:
      - name: indice
        data_tests:
          - not_null
      - name: diferencia
        data_tests:
          - not_null

  - name: fct_canasta_provincia_grupo
    description: >
      Ranking de cadenas por grupo de producto en cada provincia, solo del último día. Misma fórmula
      que fct_canasta_provincia sobre los productos de la comparación de cada grupo; solo grupos con
      al menos 30 productos por cadena.
    data_tests:
      - unique:
          arguments:
            column_name: "fecha || '|' || provincia || '|' || grupo || '|' || id_comercio"
    columns:
      - name: grupo
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('rubros')
                field: grupo
      - name: indice
        data_tests:
          - not_null
      - name: productos_comparados
        data_tests:
          - not_null

  - name: fct_cobertura
    description: >
      Cobertura de cada cadena por provincia y día contra la mediana de los 28 días anteriores.
      cobertura_baja marca los días por debajo del 80 %: ahí un pico de un día es efecto de muestra.
    data_tests:
      - unique:
          arguments:
            column_name: "fecha || '|' || id_comercio || '|' || provincia"
    columns:
      - name: cobertura_baja
        data_tests:
          - not_null
          
  - name: fct_precio_kilo_provincia
    description: >
      Precio por kilo de los productos cotidianos que se venden al peso, por cadena y provincia, último día de
      cada provincia. Qué producto es cada pesable sale de la seed pesables_producto.
    columns:
      - name: producto
        data_tests: [not_null]
      - name: precio_kg
        data_tests: [not_null]
      - name: productos
        data_tests: [not_null]