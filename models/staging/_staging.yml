version: 2

models:
  - name: stg_precios
    description: "Precios diarios por sucursal y producto (una vista sobre los Parquet)"
    columns:
      - name: fecha
        data_tests:
          - not_null
      - name: id_comercio
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['15', '10', '11', '9', '12', '2', '13']
      - name: id_producto
        data_tests:
          - not_null

  - name: stg_sucursales
    description: "Sucursales por fecha. Una fila por fecha, comercio, bandera y sucursal"
    data_tests:
      - unique:
          arguments:
            column_name: "fecha || '|' || id_comercio || '|' || id_bandera || '|' || id_sucursal"
    columns:
      - name: fecha
        data_tests:
          - not_null
      - name: id_sucursal
        data_tests:
          - not_null
  - name: stg_productos
    description: "Productos por fecha y comercio, con la clave comparable entre cadenas y la marca normalizada"
    data_tests:
      - unique:
          arguments:
            column_name: "fecha || '|' || id_comercio || '|' || id_producto"
    columns:
      - name: id_producto
        data_tests:
          - not_null
      - name: clave
        data_tests:
          - not_null