version: 2

models:
  - name: int_precios_dia
    description: "Agregado diario por fecha, comercio, producto y provincia (sin Web ni sin provincia)"
    data_tests:
      - unique:
          arguments:
            column_name: "fecha || '|' || id_comercio || '|' || id_producto || '|' || provincia"
    columns:
      - name: fecha
        data_tests:
          - not_null
      - name: id_comercio
        data_tests:
          - not_null
      - name: id_producto
        data_tests:
          - not_null
      - name: provincia
        data_tests:
          - not_null
      - name: precio_lista_mediana
        data_tests:
          - not_null

  - name: int_ultima_vista
    description: "Última fecha en que se vio cada comercio, producto y provincia"
    data_tests:
      - unique:
          arguments:
            column_name: "id_comercio || '|' || id_producto || '|' || provincia"
    columns:
      - name: ultima_fecha_vista
        data_tests:
          - not_null
  
  - name: int_canasta_precios_dia
    description: "Mediana nacional del precio de lista de cada producto de la canasta, por fecha y cadena. Se guarda para siempre"
    data_tests:
      - unique:
          arguments:
            column_name: "fecha || '|' || id_comercio || '|' || clave"
    columns:
      - name: precio_lista_mediana
        data_tests:
          - not_null