name: sepa
version: "1.0.0"
profile: sepa

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]

clean-targets: ["target", "dbt_packages"]

seeds:
  sepa:
    canasta:
      +column_types:
        ean: varchar
        version: integer
    cadenas:
      +column_types:
        id_comercio: varchar
        
models:
  sepa:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table