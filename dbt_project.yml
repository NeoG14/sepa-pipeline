name: sepa
version: "1.0.0"
profile: sepa

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]

clean-targets: ["target", "dbt_packages"]

seeds:
  sepa:
    canasta:
      +column_types:
        ean: varchar
        version: integer
    cadenas:
      +column_types:
        id_comercio: varchar
    rubros_manuales:
      +column_types:
        clave: varchar
        rubro: varchar
        motivo: varchar
    pesables_producto:
      +column_types:
        id_comercio: varchar
        id_producto: varchar
        factor_kg: double
    rubros_llm:
      +column_types:
        clave: varchar
        rubro: varchar
    ingredientes:
      +column_types:
        ingrediente: varchar
        unidad: varchar
        rubro: varchar
        incluye: varchar
        excluye: varchar
        tam_min: double
        tam_max: double
    recetas:
      +column_types:
        receta: varchar
        porciones: integer
        ingrediente: varchar
        cantidad: double
        unidad: varchar
        fuente: varchar
        opciones: varchar
    ingrediente_producto:
      +column_types:
        id_comercio: varchar
        id_producto: varchar
        ingrediente: varchar
        tamano: double

models:
  sepa:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table
