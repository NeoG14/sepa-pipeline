name: Etapa 0 - consultar catálogo

on:
  workflow_dispatch:   # solo manual, por ahora

permissions:
  contents: read

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnóstico con curl
        run: |
          UA="sepa-pipeline-portfolio/0.1 (github.com/NeoG14/sepa-pipeline)"
          echo "== API (package_show) =="
          curl -s -o /dev/null -D - -A "$UA" -w "--> HTTP %{http_code}\n" \
            "https://datos.produccion.gob.ar/api/3/action/package_show?id=sepa-precios"
          echo "== Archivo del jueves (solo cabeceras, no se descarga) =="
          curl -s -I -A "$UA" -w "--> HTTP %{http_code}\n" \
            "https://datos.produccion.gob.ar/dataset/6f47ec76-d1ce-4e34-a7e1-621fe9b1d0b5/resource/d076720f-a7f0-4af8-b1d6-1b99d5a90c14/download/sepa_jueves.zip"
      - name: Consultar catálogo del portal
        run: python scripts/consultar_catalogo.py